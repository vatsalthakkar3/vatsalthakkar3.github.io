      <rect x="820" y="209" width="28" height="28" rx="2"/><rect x="852" y="209" width="28" height="28" rx="2"/>
      <rect x="884" y="209" width="28" height="28" rx="2"/><rect x="916" y="209" width="28" height="28" rx="2"/>

      <rect x="820" y="241" width="28" height="28" rx="2"/><rect x="852" y="241" width="28" height="28" rx="2"/>
