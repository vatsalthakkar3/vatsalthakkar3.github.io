  <!-- oneshot API snippet -->
  <rect x="960" y="300" width="220" height="140" rx="8" fill="#0C0A00" stroke="#78350F" stroke-width="1" opacity="0.95"/>
  <text x="975" y="322" font-family="'SF Mono',monospace" font-size="11" fill="#F59E0B">LLM Compressor</text>
  <text x="975" y="340" font-family="'SF Mono',monospace" font-size="10" fill="#78350F">────────────────</text>
  <text x="975" y="358" font-family="'SF Mono',monospace" font-size="10" fill="#94A3B8">from llmcompressor</text>
  <text x="975" y="374" font-family="'SF Mono',monospace" font-size="10" fill="#94A3B8">  import oneshot</text>
  <text x="975" y="392" font-family="'SF Mono',monospace" font-size="10" fill="#F59E0B">oneshot(</text>
  <text x="975" y="408" font-family="'SF Mono',monospace" font-size="10" fill="#94A3B8">  model, recipe,</text>
  <text x="975" y="424" font-family="'SF Mono',monospace" font-size="10" fill="#94A3B8">  dataset=calib</text>
  <text x="975" y="440" font-family="'SF Mono',monospace" font-size="10" fill="#F59E0B">)</text>

  <!-- ===== Title block ===== -->
