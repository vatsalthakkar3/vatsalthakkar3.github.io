    <g fill="url(#int8Grad)" stroke="#F59E0B" stroke-width="0.8" opacity="0.9">
      <rect x="525" y="145" width="35" height="35" rx="2"/><rect x="564" y="145" width="35" height="35" rx="2"/>
      <rect x="603" y="145" width="35" height="35" rx="2"/><rect x="642" y="145" width="35" height="35" rx="2"/>
      <rect x="681" y="145" width="35" height="35" rx="2"/>

      <rect x="525" y="184" width="35" height="35" rx="2"/><rect x="564" y="184" width="35" height="35" rx="2"/>
