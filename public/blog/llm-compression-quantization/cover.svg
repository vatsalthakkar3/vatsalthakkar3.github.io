  <!-- Accuracy bar -->
  <g>
    <rect x="82" y="500" width="1060" height="38" rx="6" fill="#1A1200" stroke="#78350F" stroke-width="1"/>
    <!-- BF16 segment -->
    <rect x="82" y="500" width="355" height="38" rx="6" fill="#92400E" opacity="0.9"/>
    <text x="95" y="524" font-family="'SF Mono',monospace" font-size="12" fill="#FDE68A" font-weight="bold">BF16  baseline accuracy</text>
