      <rect x="80" y="277" width="40" height="40" rx="2"/><rect x="124" y="277" width="40" height="40" rx="2"/>
      <rect x="168" y="277" width="40" height="40" rx="2"/><rect x="212" y="277" width="40" height="40" rx="2"/>
      <rect x="256" y="277" width="40" height="40" rx="2"/><rect x="300" y="277" width="40" height="40" rx="2"/>
      <rect x="344" y="277" width="40" height="40" rx="2"/>

      <rect x="80" y="321" width="40" height="40" rx="2"/><rect x="124" y="321" width="40" height="40" rx="2"/>
      <rect x="168" y="321" width="40" height="40" rx="2"/><rect x="212" y="321" width="40" height="40" rx="2"/>
