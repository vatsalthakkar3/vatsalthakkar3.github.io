  <line x1="0" y1="556" x2="1200" y2="556" stroke="#78350F" stroke-width="1"/>

  <text x="60" y="608" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="white" letter-spacing="-0.5">Compressing LLMs for Production</text>
  <text x="60" y="638" font-family="system-ui,sans-serif" font-size="17" fill="#F59E0B" letter-spacing="0.2">GPTQ · AWQ · SmoothQuant · LLM Compressor</text>

