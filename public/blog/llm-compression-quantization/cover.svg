      <rect x="168" y="365" width="40" height="40" rx="2"/><rect x="212" y="365" width="40" height="40" rx="2"/>
      <rect x="256" y="365" width="40" height="40" rx="2"/><rect x="300" y="365" width="40" height="40" rx="2"/>
      <rect x="344" y="365" width="40" height="40" rx="2"/>

