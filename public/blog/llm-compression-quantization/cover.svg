    <text x="525" y="118" font-family="'SF Mono',monospace" font-size="13" fill="#F59E0B" opacity="0.8">INT8  (1 byte/param)</text>
    <text x="525" y="136" font-family="'SF Mono',monospace" font-size="11" fill="#78350F" opacity="0.9">Quantized Ŵ</text>

