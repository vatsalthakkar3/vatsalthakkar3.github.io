    <text x="139" y="169" font-family="'SF Mono',monospace" font-size="9" fill="#FDE68A" opacity="0.8">16b</text>
    <text x="183" y="169" font-family="'SF Mono',monospace" font-size="9" fill="#FDE68A" opacity="0.8">16b</text>

